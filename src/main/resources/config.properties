#########################################
# Application Configuration
#
# This file is COMMITTED and must contain no real credentials.
# Put working values in src/main/resources/config.local.properties (git-ignored),
# or pass them on the command line, e.g. -Dpassword=... -Dbase.url=...
#########################################

base.url=http://192.168.1.145:8081
#########################################
# Browser Configuration
#########################################

# Playwright's bundled headless Chromium lacks the H.264/mp4 codec these alert clips are stored
# in, so the app's own player silently falls back to a still-image-only view (no play-overlay,
# no <video>) and every Video Alert reads as clip-less - confirmed live: switching to "chrome"
# (the machine's real, codec-complete Chrome via Playwright's channel option) made the very same
# alert's .play-overlay/img[alt="play"] appear immediately and play end-to-end. Use "chromium"
# only if real Chrome is not installed on the runner.
browser=chrome

headless=false

slowmo=200

timeout=30000

#########################################
# Login Credentials
#########################################

# Valid Credentials - placeholders only; set real values in config.local.properties
username=pradeep.m+1@solutionchamps.com
password=Admin@123

# Invalid Test Data
invalidUsername=invalid@example.com
invalidPassword=CHANGE_ME_INVALID

# Forgot Password
otp=000000

#########################################
# Screenshot
#########################################

screenshot=true

#########################################
# Video Recording
#########################################

video=false

#########################################
# Tracing
#########################################

trace=true

#########################################
# Map Camera Validation
#########################################
map.screenshot.directory=target/soak-test/screenshots/map
map.validation.max.cameras=4
# Leave blank for a fresh random order each iteration; set a number to reproduce a run.
map.validation.random.seed=

#########################################
# Archive / Playback Camera Validation
#########################################
archive.screenshot.directory=target/soak-test/screenshots/archive
archive.device.tree.timeout.ms=30000
# Leave blank for a fresh random device each iteration; set a number to reproduce a run.
archive.validation.random.seed=
# Restrict the random pick to devices whose tree row is not marked offline.
archive.online.only=true
# true = a device with no status marker at all is skipped instead of treated as online.
archive.online.strict=false
# Case-insensitive regexes matched against the device row markup (text, classes, attributes).
# Leave blank to use the built-in defaults.
archive.online.pattern=
archive.offline.pattern=
# How long a just-added stream is given to hand back its first frame before it is marked failed.
archive.playback.startup.timeout.seconds=20
# How long the selected recording must keep progressing for once playback starts.
archive.playback.monitor.seconds=20
# Poll cadence during that window.
archive.playback.monitor.interval.ms=2000
# Consecutive non-progressing samples tolerated before the stream counts as stalled.
archive.playback.monitor.stall.samples=3

#########################################
# Event Search (Archive's own "Search"/Events tab)
#########################################
# true (default): open Search, set a From/To date range, Apply, verify at least one result comes
# back, select one dynamically, and confirm its video actually plays. Runs after Archive Camera
# Validation above - never modifying ArchiveValidation itself (a separate class). Set false to skip.
soak.enable.event.search=true
# Days back from today for the range's "From" date (today is always the "To" date). Required:
# confirmed live, a range confined to a single calendar month never enables the date picker's own
# Apply button - only a genuine cross-month range does - so this must stay well above the ~28-31
# days needed to guarantee that regardless of where in the month "today" falls.
event.search.date.range.days=40
event.search.screenshot.directory=target/soak-test/screenshots/event-search

#########################################
# Archive Export (Archive's own "Exports" tab)
#########################################
# true (default): select one available export record dynamically, open its Preview, verify the
# preview video, download it, and verify the downloaded file - reusing the existing download
# mechanism (no second download implementation). Runs after Event Search and Bookmark Search above
# - never modifying either of those, or ArchiveValidation. Set false to skip.
soak.enable.archive.export=true
archive.export.screenshot.directory=target/soak-test/screenshots/archive-export
archive.export.download.directory=target/soak-test/downloads/archive-export
# A video export can take longer than this feature's normal 15s control-wait just to begin
# downloading (server-side preparation), so the download event itself gets a longer window.
archive.export.download.timeout.ms=45000

#########################################
# API Response Monitoring (observability only)
#########################################
api.monitor.enabled=true
api.monitor.output.directory=target/soak-test/api-failures
# Per-page API gating: how long to wait for a page's API calls, and how long they must stay quiet.
# Requests cancelled by navigation (net::ERR_ABORTED) are noise; set true to record them anyway.
api.monitor.record.aborted=false
api.page.timeout.ms=30000
api.page.quiet.ms=1200
# true = a page's API failures fail the page; false = report only, UI result decides.
api.page.validation.strict=true
# Background pollers: excluded from page-completion waiting, still checked for failures.
api.monitor.polling.urls=/health,/heartbeat,/ping,/keep-alive,/notifications,/unread
# false = screenshot only when the UI failed; true = also when a healthy page had an API failure.
api.page.screenshot.on.api.failure=false
soak.screenshot.root=target/soak-test/screenshots

#########################################
# Live View continuous monitoring
#########################################
soak.liveview.monitor.seconds=10
soak.liveview.monitor.interval.seconds=5
liveview.screenshot.directory=target/soak-test/screenshots/live-view

#########################################
# Soak Health Check (disabled by default)
#########################################
soak.enabled=false
soak.duration.hours=24
soak.interval.minutes=30
soak.camera.name=Device
soak.camera.id=
soak.enable.live=true
soak.enable.playback=true
soak.enable.alert=true
soak.alert.required=false
soak.enable.logout=true
soak.capture.pass.screenshot=false
soak.capture.failure.screenshot=true
soak.capture.failure.trace=true
soak.output.directory=target/soak-results
soak.stream.timeout.ms=15000
soak.page.timeout.ms=120000
# Dashboard tabs (Alerts, Device, Infra): navigate each right after login and observe its API
# traffic like every other page. Set false to skip them entirely.
soak.enable.dashboard.tabs=true
# Deep Device Details validation: open one device and walk every tab (Details, Streams,
# Recordings, VA Settings, Health, Audit Logs) plus the page controls, checking each tab's
# elements, its background APIs, the stream and the Audit Log search. Set false to skip.
soak.enable.device.details=true
# Blank = open the first device the list shows as Online; set e.g. ::7005 to target one row.
device.details.device.text=
# Seconds to watch the Streams-tab media element for real playback progress.
device.details.stream.monitor.seconds=8
# true (default): run the full Capture Day Image -> Capture Night Image -> Save flow and verify
# the save is confirmed (success toast or the dialog closing). This writes reference images on
# the device. Set false to make it a presence-only check (open the dialog, confirm the buttons,
# dismiss without saving).
device.details.capture.image.save=true
device.details.screenshot.directory=target/soak-test/screenshots/device-details

#########################################
# Device Creation: Devices -> Add Devices -> Add Device Manually -> connection details ->
# Test Connection -> onboarding details -> Save changes. Runs before the existing Devices /
# Device Tabs / Device Details checks, none of which are modified. Set false to skip.
#########################################
soak.enable.device.creation=true
device.creation.ip=154.210.224.77
device.creation.http.port=7003
device.creation.rtsp.port=8003
device.creation.username=test
device.creation.password=Test@123
# A per-run 6-digit timestamp suffix is appended in code (same convention as
# user/group/role creation) so repeated runs never collide on name.
device.creation.name=Soak test device
device.creation.site=Site Arming - coimbatore
# Optional nested site/zone selection shown after the Site above is picked; leave blank to skip.
device.creation.site.secondary=site permission test 1

#########################################
# Project Hierarchy: random Node + Site edit/save validation
#########################################
# true (default): select one random Node and one random Site from the tree, validate each row's
# details panel loads, open Edit -> Save changes for each, and validate the save API resolves
# (pass or fail). Set false to skip.
soak.enable.project.hierarchy=true
project.hierarchy.screenshot.directory=target/soak-test/screenshots/project-hierarchy
# Leave blank for a fresh random Node/Site pick each iteration; set a number to reproduce a run.
project.hierarchy.random.seed=
# Audit Logs sub-flow (runs after the Node/Site edit above, before Devices): search term used to
# exercise the Audit Logs search box. Either a "no-data-image" empty state or real result rows is a
# valid outcome for this term - only the search API's HTTP status and the export download are
# actually pass/fail checked.
project.hierarchy.audit.log.search.term=dg

#########################################
# Reports: page load, search + export validation
#########################################
# true (default): open the Reports page, search it (either the "no-data-image" empty state or real
# result rows is a valid outcome for the term below - the search API's HTTP status is what is
# actually pass/fail checked), then open whichever report is first in the list - discovered
# dynamically from its own "View <id>" action, never a hardcoded id - and confirm Export produces a
# real file download. Set false to skip.
soak.enable.reports=true
reports.search.term=dg

#########################################
# Master Configuration: create, rename, Recordings/Health/Video and Image, remove
#########################################
# true (default): open Master Configuration (nested under Devices in the left nav), click
# "Add Template" and confirm its dialog opens - cancelled again afterwards, so nothing is actually
# created. Runs after Device Tabs, before Device Details. Set false to skip.
soak.enable.master.configuration=true
master.configuration.screenshot.directory=target/soak-test/screenshots/master-configuration

#########################################
# Application Settings: Settings -> Infra Management -> Application Settings -> Device
#########################################
# true (default): dynamically toggles "Enable QC" and "Enable VA Alerts" (regardless of which
# state either starts in) and validates each one's background save API. Runs after License,
# before Users & Roles / Organisation. Set false to skip.
soak.enable.application.settings=true

#########################################
# Users & Roles: Settings -> Users & Roles -> Users -> Add User -> full user lifecycle
#########################################
# true (default): create one user from the test data below (form + profile picture + role/group +
# Website/Mobile access + create-user API), then run its lifecycle - open, inactivate, activate,
# edit First Name, delete - validating each operation's API and success toast. Runs after
# Application Settings, before the existing Users & Roles / Organisation checks (untouched). The
# created user is deleted again at the end. Set false to skip.
soak.enable.user.creation=true
user.creation.first.name=Pradeep
user.creation.last.name=Testing
user.creation.email=pradeep.m+50@solutionchamps.com
user.creation.mobile=99999999999
user.creation.role=Quality Check
user.creation.group=Test
# Path (relative to the working directory) to the profile picture to upload. Drop the real file
# here; a missing file just skips the picture step, the rest of the flow still runs.
user.creation.profile.picture=src/test/resources/Logo.jpg
# The lifecycle edit step appends this to the First Name (e.g. "Pradeep" -> "Pradeep update").
user.update.first.name.suffix=update

#########################################
# Roles: Settings -> Users & Roles -> Roles -> Custom Roles -> full role lifecycle
#########################################
# true (default): create one Custom Role (name + "Full" permission), verify it is listed, rename
# it, verify the rename, delete it, and verify it is gone - validating each operation's API and
# success toast. Runs after the User lifecycle, before the existing Users & Roles / Organisation
# checks (untouched). Set false to skip.
soak.enable.role.creation=true
role.creation.name=Testing role
# The lifecycle edit step appends this to the role name (e.g. "Testing role" -> "Testing role-update").
role.update.name.suffix=-update

#########################################
# Groups: Settings -> Users & Roles -> Groups -> full group lifecycle
#########################################
# true (default): create one Custom Group (name + Email/Whatsapp/SMS notifications), verify it is
# listed, rename it, verify the rename, delete it, and verify it is gone - validating each
# operation's API and success toast. Runs after the Role lifecycle, before the existing Users &
# Roles / Organisation checks (untouched). Set false to skip.
soak.enable.group.creation=true
group.creation.name=Testing group
# The lifecycle edit step appends this to the group name with a separating space added in code
# (e.g. "Testing group" -> "Testing group update") - ConfigReader.getOrDefault() trims its result,
# so a leading space here would be silently discarded even when backslash-escaped (confirmed live:
# that earlier approach still produced "Testing groupupdate" with no space).
group.update.name.suffix=update

#########################################
# Organisation: Settings -> Organisation -> Profile -> logo upload
#########################################
# true (default): uploads a new organization logo via the "Edit organization logo" icon and its
# "Change logo" crop dialog, then guarantees that dialog is actually closed afterward rather than
# assuming the app closes it on its own. Runs right after the existing Organisation check (left
# untouched). Set false to skip.
soak.enable.organisation.logo=true
# Path (relative to the working directory) to the image to upload as the logo. A missing file just
# skips this step, the rest of the soak run still runs.
organisation.logo.path=src/test/resources/Logo.jpg
# Admin Details / Primary Contact / Address Details update values (Primary Contact is also saved
# once unchanged first, to check the plain save-without-modification path).
organisation.admin.last.name=kumar
organisation.primary.contact.last.name=Kumar update
organisation.address.line1=1 Railway Station Road, Madhira Bazar, Hyderabad, Telangana.
organisation.address.line2=1 Station Road, Madhira Bazar 11, Hyderabad.

#########################################
# Project Information: Settings -> Organisation -> Project Information
#########################################
# true (default): updates the project logo, the Description field (twice - an interim value, then
# the final one below, so the final save is the one verified as displayed), Project Admin
# Details' Last Name, and Address Details' Address Line 1, validating each save's toast. Runs
# right after the Organisation update above (which must also be enabled). Set false to skip.
soak.enable.project.information=true
project.information.description=Detect events in real time, integrate with other city systems, and route.a
project.information.description.final=Detect events in real time, integrate with other city systems, and route. Update
project.information.admin.last.name=kumar - Update
project.information.address.line1=Railway Station Road, Madhira Bazar, Hyderabad, Telangana. - Update

#########################################
# License: Settings -> Organisation -> License -> Activate New License
#########################################
# true (default): opens "Activate New License", validates the background license-lookup API(s) it
# triggers, verifies the dialog's own content, and closes it again - never actually submits a
# license. Runs right after Project Information above (which must also be enabled), then reuses
# the existing Audit Logs page for Organisation's own Audit Logs tab. Set false to skip both.
soak.enable.license.validation=true

#########################################
# Audit Logs: Settings -> Users & Roles -> Audit Logs -> clear filter + export
#########################################
# true (default): opens the Audit Logs tab, clears the Date & Time filter and verifies it is
# actually cleared, verifies the page's stable controls, exports the log, and validates whatever
# comes back (a real downloaded file, or the export API's own status when none arrives). Runs
# after the Group lifecycle, before the existing Users & Roles / Organisation checks (untouched).
# Set false to skip.
soak.enable.audit.logs.export=true

#########################################
# QC: Settings -> QC -> checklist section + checklist item lifecycle
#########################################
# true (default): create one checklist section (title + description), verify it is listed, add
# one checklist item to it (toggling its switch twice to exercise both states before saving),
# verify it is listed under the section, rename the section, rename the item, delete the item,
# verify it is gone, delete the section, verify it is gone - validating each operation's API and
# success toast. Runs after Audit Logs above. Set false to skip.
soak.enable.qc.checklist=true
qc.checklist.section.name=Testing
qc.checklist.section.description=Testing description
qc.checklist.section.update.name.suffix=-updated
qc.checklist.section.update.description.suffix=-Updated
qc.checklist.item.name=Testing check list
qc.checklist.item.update.name.suffix=-Update

#########################################
# Event Acknowledgement: Settings -> Event Check -> Event Acknowledgement
#########################################
# true (default): create one acknowledgement message (a run-unique name so repeated executions
# never collide), verify it is listed, rename it, verify the rename, delete it, and verify it is
# gone - validating each operation's API and success toast. Runs after the QC checklist lifecycle
# above. Set false to skip.
soak.enable.event.acknowledgement=true
event.acknowledgement.message.name=Testing Event
# Separating space added in code (see group.update.name.suffix above for why a config-carried
# leading space does not survive ConfigReader.getOrDefault()'s trim).
event.acknowledgement.update.name.suffix=Update

#########################################
# Live View CRUD: Live View -> My Views -> Cameras -> create/configure/rename/delete a view
#########################################
# true (default): create one view (a run-unique name), change its grid layout, add cameras from
# the device tree (see live.view.crud.camera.paths below), save the configuration, save the view,
# rename it, verify the rename, delete it, and verify it is gone - validating each write's API and
# success toast. Runs after Event Acknowledgement above, before the existing Live View monitoring
# check (untouched - a separate page class). Set false to skip.
soak.enable.live.view.crud=true
live.view.crud.name=Live View
live.view.crud.update.name.suffix=-Update
live.view.crud.grid.layout=3x3
# Semicolon-separated camera tree paths; each is a ">"-separated sequence of tree-item names ending
# in the camera itself, e.g. "Site A>Camera 1;Site B>Camera 2". Required: confirmed live, the app
# refuses to save a view with no camera ("Add at least one camera or sequence before saving."), so
# an empty value here means the flow can create/configure a draft but never actually persist it.
# Update this if this environment's device tree differs.
live.view.crud.camera.paths=SCT PROJECT>Sct n -branch campus>SCT Site>NVR2>Device 7001

#########################################
# Sequence: VMS Operator -> Cameras -> Sequence -> create/rename/add-to-tile/delete a sequence
#########################################
# true (default): create one sequence (a run-unique name) with cameras from the device tree (see
# sequence.crud.camera.paths below), rename it, best-effort add it to a dynamically-picked existing
# grid tile (never a fixed tile/index - a locator/toast miss on that one secondary step is logged
# but does not fail the sequence), then delete it and verify it is gone - validating each write's
# API and success toast. Runs after the existing Live View monitoring check and its continuous
# camera/API validation above (both untouched - SequencePage is a separate page class that never
# calls into Live_view or LiveViewCrudPage). Set false to skip.
soak.enable.sequence=true
sequence.crud.name=Test Sequence
sequence.crud.update.name.suffix=-Update
# Semicolon-separated camera tree paths; same format as live.view.crud.camera.paths above. Required:
# confirmed live, this app refuses to create a sequence with fewer than 2 cameras, so at least 2
# entries are needed here for the create step to actually submit. Update this if this environment's
# device tree differs.
sequence.crud.camera.paths=SCT PROJECT>Sct n -branch campus>SCT Site>NVR2>Device 7001;SCT PROJECT>Sct n -branch campus>SCT Site>NVR2>Device05

#########################################
# Audit Logs - Search (post-Sequence): reuses the existing AuditLogsPage export flow, then
# searches for a run-unique, guaranteed-non-existent value and confirms "No records found", then
# best-effort searches a known-existing value. Runs after the Sequence lifecycle above. Independent
# of the earlier "soak.enable.audit.logs.export" flag (the two Audit Logs Export checks after
# Users & Roles / Organisation), which is untouched.
#########################################
soak.enable.audit.logs.search=true
audit.logs.search.nonexistent.term=AuditSearch
# Optional: a substring expected to already exist among this environment's real audit-log rows
# (e.g. a username or a common action word). Left blank by default - the positive-search check is
# best-effort/skipped, never gating, when this is empty, since no such value can be assumed safely
# across environments.
audit.logs.search.existing.term=

#########################################
# API Inventory Capture (for the separate API security/performance automation module)
#
# ON: every run now snapshots every distinct API call Playwright made (method+host+path+query) to
# api.inventory.output.directory below, so a full soak run's real captured API surface is available
# to the load test (and any other comparison-against-HAR consumer) afterwards. Existing SOAK
# behavior, existing ApiMonitor failure log/output, and existing reports are unaffected either way -
# this only adds a JSON snapshot write, never changes request/response behavior.
#########################################
api.inventory.enabled=true
api.inventory.output.directory=target/apisecurity/api-inventory
# Distinct method+host+path+query combinations kept before further entries are dropped (counted,
# not stored) - mirrors api.monitor's own MAX_STORED_FAILURES safeguard.
api.inventory.max.entries=5000

#########################################
# API Security/Performance Automation (separate module; never runs as part of SOAK/testng.xml)
#########################################
apisecurity.har.path=OWSAP automation-Final.har
apisecurity.reports.directory=target/apisecurity/reports
# MissingApiRegistry's real source file - automatically revalidated/regenerated by
# MissingApiRegistryUpdater every time the inventory is built (real code, not a manual script):
# entries ApiMonitor now captures are removed, newly-confirmed-missing HAR gaps are added.
apisecurity.missing.registry.path=src/test/resources/apisecurity/missing-apis.json

# REST Assured functional validation - GET-only by policy (see ApiExecutionPolicy); every
# POST/PUT/PATCH/DELETE endpoint is reported as present-but-not-executed, never invoked.
apisecurity.restassured.scheme=http
# Optional override: host to authenticate against. Blank = auto-detect from the /auth/login entry
# already present in the combined inventory.
# Login endpoint path used by the API security/performance modules (this app: /api/v1/auth/login).
apisecurity.auth.login.path=/api/v1/auth/login
apisecurity.auth.host=
apisecurity.restassured.delay.ms=300
apisecurity.restassured.timeout.ms=15000
apisecurity.restassured.response.time.threshold.ms=5000
# Consecutive FAILs before the run stops calling further APIs (never hammer an unhealthy server).
apisecurity.restassured.circuit.breaker.consecutive.failures=3
# 0 = no cap; set a small number for a quick smoke pass instead of the full eligible set.
apisecurity.restassured.max.apis=0

# OWASP API Security Top 10 checks (Steps 8-9) - same GET-only policy, plus these bounds:
# small controlled burst size for the rate-limiting probe (API4); never uncontrolled.
apisecurity.security.rate.limit.burst=15
# how many GET responses the sensitive-data-exposure scan (API3) inspects.
apisecurity.security.exposure.sample.size=15

#########################################
# OWASP ZAP (Step 10)
#
# Passive scan only by default - real attack traffic (active scan) is OFF unless explicitly enabled.
# The real zap.api.key belongs in config.local.properties, never here (see that file's own header).
#########################################
zap.home=C:/Program Files/ZAP/Zed Attack Proxy
zap.address=localhost
zap.port=8080
zap.api.key=
# false = never auto-launch ZAP; a daemon must already be running at zap.address:zap.port.
zap.daemon.autostart=true
# Generous on purpose: ZAP's first launch after a while can spend a minute or more auto-updating
# its addons before the API responds at all. A warm daemon (or one already running) starts in seconds.
zap.daemon.startup.timeout.ms=180000
zap.passive.scan.timeout.ms=30000
# Real attack payloads against the live app. Off by default; same conservative posture as everywhere
# else in this module. Only ever targets GET endpoints already approved by ApiExecutionPolicy.
zap.active.scan.enabled=false
zap.active.scan.max.urls=10
zap.active.scan.per.url.timeout.ms=60000

#########################################
# JMeter Performance Testing (Step 11)
#
# Only the READ (GET) category is executed - same GET-only policy as REST Assured/OWASP/ZAP.
# CREATE/UPDATE/DELETE/AUTH/STREAMING/CONTROL/DEVICE/REPORTING categories are classified and listed
# in the report but never load-tested automatically: concurrent virtual users hitting a write
# endpoint would multiply real mutations, and AUTH's own /auth/login is rate-limited (5/window) so
# it must never be re-logged-into by every virtual user - one token, obtained once, is shared by all.
#
# Deliberately conservative smoke-level defaults - never "load" or "stress" numbers. Override via the
# JMETER_USERS / JMETER_RAMP_UP / JMETER_DURATION environment variables the brief itself names, or
# these properties.
#########################################
jmeter.home=C:/Program Files/apache-jmeter-5.6.3
apisecurity.jmeter.users=5
apisecurity.jmeter.rampup.seconds=10
apisecurity.jmeter.duration.seconds=30
apisecurity.jmeter.think.time.ms=500
apisecurity.performance.directory=target/apisecurity/performance
