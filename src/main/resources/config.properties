#########################################
# Application Configuration
#
# This file is COMMITTED and must contain no real credentials.
# Put working values in src/main/resources/config.local.properties (git-ignored),
# or pass them on the command line, e.g. -Dpassword=... -Dbase.url=...
#########################################

base.url=http://192.168.1.145:8081/
#########################################
# Browser Configuration
#########################################

browser=chromium

headless=false

slowmo=200

timeout=30000

#########################################
# Login Credentials
#########################################

# Valid Credentials - placeholders only; set real values in config.local.properties
username=pradeep.m+1@solutionchamps.com
password=Admin@123

# Invalid Test Data
invalidUsername=invalid@example.com
invalidPassword=CHANGE_ME_INVALID

# Forgot Password
otp=000000

#########################################
# Screenshot
#########################################

screenshot=true

#########################################
# Video Recording
#########################################

video=false

#########################################
# Tracing
#########################################

trace=true

#########################################
# Map Camera Validation
#########################################
map.screenshot.directory=target/soak-test/screenshots/map
map.validation.max.cameras=4
# Leave blank for a fresh random order each iteration; set a number to reproduce a run.
map.validation.random.seed=

#########################################
# Archive / Playback Camera Validation
#########################################
archive.screenshot.directory=target/soak-test/screenshots/archive
archive.device.tree.timeout.ms=30000
# Leave blank for a fresh random device each iteration; set a number to reproduce a run.
archive.validation.random.seed=
# Restrict the random pick to devices whose tree row is not marked offline.
archive.online.only=true
# true = a device with no status marker at all is skipped instead of treated as online.
archive.online.strict=false
# Case-insensitive regexes matched against the device row markup (text, classes, attributes).
# Leave blank to use the built-in defaults.
archive.online.pattern=
archive.offline.pattern=
# How long the selected recording must keep progressing for once playback starts.
archive.playback.monitor.seconds=30
# Poll cadence during that window.
archive.playback.monitor.interval.ms=2000
# Consecutive non-progressing samples tolerated before the stream counts as stalled.
archive.playback.monitor.stall.samples=3

#########################################
# API Response Monitoring (observability only)
#########################################
api.monitor.enabled=true
api.monitor.output.directory=target/soak-test/api-failures
# Per-page API gating: how long to wait for a page's API calls, and how long they must stay quiet.
# Requests cancelled by navigation (net::ERR_ABORTED) are noise; set true to record them anyway.
api.monitor.record.aborted=false
api.page.timeout.ms=30000
api.page.quiet.ms=1200
# true = a page's API failures fail the page; false = report only, UI result decides.
api.page.validation.strict=true
# Background pollers: excluded from page-completion waiting, still checked for failures.
api.monitor.polling.urls=/health,/heartbeat,/ping,/keep-alive,/notifications,/unread
# false = screenshot only when the UI failed; true = also when a healthy page had an API failure.
api.page.screenshot.on.api.failure=false
soak.screenshot.root=target/soak-test/screenshots

#########################################
# Live View continuous monitoring
#########################################
soak.liveview.monitor.seconds=60
soak.liveview.monitor.interval.seconds=5
liveview.screenshot.directory=target/soak-test/screenshots/live-view

#########################################
# Soak Health Check (disabled by default)
#########################################
soak.enabled=false
soak.duration.hours=24
soak.interval.minutes=30
soak.camera.name=Device
soak.camera.id=
soak.enable.live=true
soak.enable.playback=true
soak.enable.alert=true
soak.alert.required=false
soak.enable.logout=true
soak.capture.pass.screenshot=false
soak.capture.failure.screenshot=true
soak.capture.failure.trace=true
soak.output.directory=target/soak-results
soak.stream.timeout.ms=15000
soak.page.timeout.ms=120000
